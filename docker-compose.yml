version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pln_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pln_covid_db
      POSTGRES_USER: pln_user
      POSTGRES_PASSWORD: pln_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pln_user -d pln_covid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: pln_nlp_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    volumes:
      - ./datasets:/app/datasets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pln_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pln_covid_db
      - SPRING_DATASOURCE_USERNAME=pln_user
      - SPRING_DATASOURCE_PASSWORD=pln_secure_password_2026
      - NLP_SERVICE_URL=http://nlp-service:8000
      - JWT_SECRET=c2VjdXJlX2FjYWRlbWljX2tleV9wbG5fY292aWRfZGVlcG1pbmRfcGxhdGZvcm1fMjAyNg==
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pln_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_NLP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
