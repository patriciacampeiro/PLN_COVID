server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: pln-covid-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pln_covid_db}
    username: ${SPRING_DATASOURCE_USERNAME:pln_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pln_secure_password_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

nlp:
  service:
    url: ${NLP_SERVICE_URL:http://localhost:8000}

security:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlX2FjYWRlbWljX2tleV9wbG5fY292aWRfZGVlcG1pbmRfcGxhdGZvcm1fMjAyNg==}
    expiration-ms: 86400000 # 24 horas

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
